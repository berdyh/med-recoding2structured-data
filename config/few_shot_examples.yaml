        attributes:
          warning_group: "warn_2"
      - class: "warning_type"
        text: "neurological"
        attributes:
          warning_group: "warn_2"
      - class: "severity"
        text: "immediate"
        attributes:
          warning_group: "warn_2"
      - class: "warning_description"
