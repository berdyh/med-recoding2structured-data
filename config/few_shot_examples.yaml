# Follow-up plan extraction examples
follow_up:
  - text: "Avoid heavy lifting for 1-2 weeks. Return in 7 days if no improvement."
    extractions:
      - class: "follow_up_type"
        text: "activity restriction"
        attributes:
          followup_group: "fu_1"
      - class: "action"
        text: "avoid heavy lifting"
        attributes:
          followup_group: "fu_1"
      - class: "timing"
        text: "1-2 weeks"
        attributes:
          followup_group: "fu_1"
      - class: "follow_up_type"
        text: "review appointment"
        attributes:
          followup_group: "fu_2"
      - class: "timing"
        text: "7 days"
        attributes:
          followup_group: "fu_2"
      - class: "condition"
        text: "if no improvement"
        attributes:
          followup_group: "fu_2"
  
  - text: "Complete the full 10-day antibiotic course. Follow up in 2 weeks or sooner if symptoms worsen."
    extractions:
      - class: "follow_up_type"
        text: "medication compliance"
        attributes:
          followup_group: "fu_1"
      - class: "action"
        text: "complete the full antibiotic course"
        attributes:
          followup_group: "fu_1"
      - class: "timing"
        text: "10-day"
        attributes:
          followup_group: "fu_1"
      - class: "follow_up_type"
        text: "review appointment"
        attributes:
          followup_group: "fu_2"
      - class: "timing"
        text: "2 weeks"
        attributes:
          followup_group: "fu_2"
      - class: "condition"
        text: "or sooner if symptoms worsen"
        attributes:
          followup_group: "fu_2"
      - class: "priority"
        text: "urgent if worsening"
        attributes:
          followup_group: "fu_2"
